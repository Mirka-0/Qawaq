<svg viewBox="0 0 512 512" width="512" height="512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="qawaq-bg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141d2e" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>
    <linearGradient id="qawaq-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="qawaq-eye-pupil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffc043" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="qawaq-reticle" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3d4d68" />
      <stop offset="100%" stop-color="#253246" />
    </linearGradient>
    <filter id="qawaq-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#f59e0b" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="16" y="16" width="480" height="480" rx="115" fill="url(#qawaq-bg)" stroke="#27354d" stroke-width="6" />
  <rect x="24" y="24" width="464" height="464" rx="107" fill="none" stroke="#1a2538" stroke-width="2" />

  <!-- Reticle Axis -->
  <g stroke="#3a4964" stroke-width="3" stroke-dasharray="8 8" opacity="0.75">
    <line x1="256" y1="90" x2="256" y2="422" />
    <line x1="90" y1="256" x2="422" y2="256" />
  </g>

  <!-- Circular Reticle -->
  <circle cx="256" cy="256" r="140" stroke="url(#qawaq-reticle)" stroke-width="34" fill="none" />
  <g stroke="#4f6385" stroke-width="4">
    <line x1="256" y1="84" x2="256" y2="104" />
    <line x1="256" y1="408" x2="256" y2="428" />
    <line x1="84" y1="256" x2="104" y2="256" />
    <line x1="408" y1="256" x2="428" y2="256" />
  </g>

  <!-- Orange Safety Visor -->
  <path d="M 148 168 A 140 140 0 0 1 364 168" fill="none" stroke="url(#qawaq-orange)" stroke-width="38" stroke-linecap="round" filter="url(#qawaq-glow)" />

  <!-- Green Sensor Dot -->
  <g transform="translate(352, 142)">
    <circle cx="0" cy="0" r="17" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.6" />
    <circle cx="0" cy="0" r="11" fill="#10b981" />
    <circle cx="-3" cy="-3" r="3" fill="#6ee7b7" />
  </g>

  <!-- Orange Q Tail -->
  <g filter="url(#qawaq-glow)">
    <rect x="306" y="306" width="40" height="108" rx="12" transform="rotate(-45 306 306)" fill="url(#qawaq-orange)" />
  </g>

  <!-- Eye -->
  <path d="M 152 256 C 184 190 328 190 360 256 C 328 322 184 322 152 256 Z" fill="#060b14" stroke="url(#qawaq-orange)" stroke-width="11" stroke-linejoin="round" />
  <circle cx="256" cy="256" r="38" fill="url(#qawaq-eye-pupil)" />
  <circle cx="256" cy="256" r="20" fill="#0a0a0c" />
  <circle cx="264" cy="246" r="8" fill="#ffffff" />
  <circle cx="248" cy="264" r="3.5" fill="#ffedd5" opacity="0.8" />
</svg>
