<svg viewBox="0 0 512 512" width="512" height="512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Clean Solid/Gradient Dark Background -->
    <linearGradient id="qawaq-bg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#151d2e" />
      <stop offset="50%" stopColor="#0d1424" />
      <stop offset="100%" stopColor="#080c16" />
    </linearGradient>

    <!-- Orange Arc Gradient -->
    <linearGradient id="qawaq-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#ffa71a" />
      <stop offset="50%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#ea580c" />
    </linearGradient>

    <!-- Q Tail Gradient -->
    <linearGradient id="qawaq-tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#fb923c" />
      <stop offset="100%" stopColor="#ea580c" />
    </linearGradient>

    <!-- Center Eye Gradient -->
    <linearGradient id="qawaq-iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#ffb940" />
      <stop offset="50%" stopColor="#f97316" />
      <stop offset="100%" stopColor="#c2410c" />
    </linearGradient>

    <!-- Radar Circle Slate Gradient -->
    <linearGradient id="qawaq-slate-ring" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#3d4f6c" />
      <stop offset="100%" stopColor="#2c3a50" />
    </linearGradient>
  </defs>

  <!-- Dark navy squircle rounded background with NO outer border -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#qawaq-bg)" />

  <!-- Center Crosshair / Aim Reticle Guides -->
  <g stroke="#3a4b66" stroke-width="3.5" opacity="0.85">
    <line x1="256" y1="108" x2="256" y2="404" stroke-dasharray="6 7" />
    <line x1="120" y1="256" x2="162" y2="256" stroke-dasharray="5 5" />
    <line x1="350" y1="256" x2="392" y2="256" stroke-dasharray="5 5" />
  </g>

  <!-- Outer Slate Circle (Viewfinder / Q Loop) -->
  <circle cx="256" cy="256" r="142" stroke="url(#qawaq-slate-ring)" stroke-width="36" fill="none" />

  <!-- Top Vibrant Orange Radar Arc -->
  <path d="M 152 166 A 142 142 0 0 1 356 156" fill="none" stroke="url(#qawaq-orange)" stroke-width="38" stroke-linecap="round" />

  <!-- Radar Ping Green Node at right end of orange arc -->
  <circle cx="360" cy="148" r="13" fill="#10b981" />
  <circle cx="360" cy="148" r="21" stroke="#10b981" stroke-width="3" fill="none" opacity="0.85" />

  <!-- Orange Rectangular Q-Tail (Bottom-Right 45 degrees, NO glow) -->
  <rect x="306" y="306" width="42" height="106" rx="12" transform="rotate(-45 306 306)" fill="url(#qawaq-tail)" />

  <!-- Center Eye Shape -->
  <path d="M 166 256 C 196 198 316 198 346 256 C 316 314 196 314 166 256 Z" fill="#080c14" stroke="#1e293b" stroke-width="4" stroke-linejoin="round" />

  <!-- Iris & Pupil -->
  <circle cx="256" cy="256" r="35" fill="url(#qawaq-iris)" />
  <circle cx="256" cy="256" r="17" fill="#0a0e18" />
  <!-- White Specular Light Reflection -->
  <circle cx="266" cy="246" r="8.5" fill="#ffffff" />
  <circle cx="249" cy="264" r="3" fill="#fed7aa" opacity="0.75" />
</svg>
